{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Бюджетное планирование{% endblock %}</title>
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    >
    <link
        rel="stylesheet"
        href="{% static 'homepage/css/style.css' %}"
    >
</head>
<body>
    <header class="site-header">
        <div class="container d-flex flex-wrap align-items-center justify-content-between py-3">
            <a
                class="site-brand d-flex align-items-center text-decoration-none"
                href="{% url 'homepage:index' %}"
            >
                <img
                    src="{% static 'homepage/img/logo.png' %}"
                    alt="Бюджетное планирование"
                    class="site-logo"
                >
                <span class="site-brand-text"></span>
            </a>

            {% include "includes/navigation.html" %}
        </div>
    </header>

    <main class="container py-4">
        {% block content %}
        {% endblock %}
    </main>

    <footer class="container mt-4 mb-3">
        <p>
            © <span id="current-year"></span> Бюджетное планирование
        </p>
    </footer>

    <script src="{% static 'homepage/js/main.js' %}"></script>
</body>
</html>
